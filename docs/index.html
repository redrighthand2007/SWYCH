<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swych · Swap n' Switch</title>
  <meta name="description" content="Swych is a campus marketplace app for VIT students: list what you don't need, find what you do, and hand it over on campus." />
  <style>
    :root { --bg: #fff8f5; --card: #ffffff; --text: #1f1b16; --muted: #6b5e57; --brand: #ea580c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141210; --card: #1f1b18; --text: #f3ede9; --muted: #b8aca5; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card { width: 100%; max-width: 440px; text-align: center; padding: 36px 28px;
      background: var(--card); border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,.08); }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { margin: 16px 0 4px; font-size: 40px; color: var(--brand); letter-spacing: -1px; }
    p { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
    a.button { display: block; margin: 10px 0; padding: 14px; border-radius: 14px; text-decoration: none; font-weight: 600; }
    .primary { background: var(--brand); color: #fff; }
    .secondary { border: 1px solid rgba(127,127,127,.35); color: var(--text); }
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/logo.png" alt="Swych logo" />
    <h1>Swych</h1>
    <p>The campus marketplace for VIT students.<br />List it, offer, meet, swap.</p>
    <a class="button primary" href="https://github.com/redrighthand2007/SWYCH/releases/latest">Download the app</a>
    <a class="button secondary" href="https://github.com/redrighthand2007/SWYCH">View on GitHub</a>
    <a class="button secondary" href="PRIVACY_POLICY">Privacy policy</a>
  </main>
</body>
</html>
