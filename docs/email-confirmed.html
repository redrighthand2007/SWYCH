<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Email confirmed · Swych</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { --bg: #fff8f5; --card: #ffffff; --text: #1f1b16; --muted: #6b5e57; --brand: #ea580c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141210; --card: #1f1b18; --text: #f3ede9; --muted: #b8aca5; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%; max-width: 420px; text-align: center; padding: 36px 28px;
      background: var(--card); border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    .tick {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 50%;
      display: grid; place-items: center; background: var(--brand); color: #fff; font-size: 40px;
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0; color: var(--muted); line-height: 1.5; }
    .brand { margin-top: 28px; font-weight: 800; color: var(--brand); letter-spacing: -.5px; font-size: 20px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="tick" aria-hidden="true">✓</div>
    <h1>Email confirmed</h1>
    <p>Your Swych account is ready.<br />Go back to the app and log in with your VIT email and password.</p>
    <div class="brand">Swych · Swap n' Switch</div>
  </main>
  <script>
    // The confirmation link adds sign-in details after "#"; clear them from the address bar.
    if (location.hash) history.replaceState(null, "", location.pathname);
  </script>
</body>
</html>
